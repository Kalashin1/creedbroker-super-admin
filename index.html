<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>broker-version-1-admin</title>   <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      h1, h2, h3, h4 {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
      }

      * {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }

      *::-webkit-scrollbar {
        display: none; /* Chrome/Safari/Opera */
      }


      html,
      body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      /* Custom scrollbar styling (optional but recommended) */
      .custom-scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .custom-scroll::-webkit-scrollbar-track {
        background: rgb(15 23 42 / 0.5);
      }

      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgb(51 65 85);
        border-radius: 4px;
      }

      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: rgb(71 85 105);
      }

      /* src/index.css */

      /* ═══════════════════════════════════════════════════════════
        Toastify Fixes
        ═══════════════════════════════════════════════════════════ */

      /* Keep the Toastify container interactive so auto-dismiss and close work normally */
      .Toastify {
        position: fixed !important;
        top: 0 !important;
        right: 0 !important;
        width: auto !important;
        height: auto !important;
        max-width: 100vw !important;
        overflow: visible !important;
        z-index: 9999 !important;
        margin: 0 !important;
        padding: 0 !important;
        pointer-events: none !important;
      }

      /* Allow the actual toast cards to receive pointer events */
      .Toastify__toast-container {
        position: fixed !important;
        z-index: 9999 !important;
        margin: 0 !important;
        padding: 0 !important;
        pointer-events: none !important;
      }

      .Toastify__toast {
        pointer-events: auto !important;
      }

      /* Restore toast icons properly */
      .Toastify__toast-icon {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 20px !important;
        height: 20px !important;
        margin-right: 10px !important;
        flex-shrink: 0 !important;
      }

      .Toastify__toast-icon svg {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }

      /* Dark theme styling */
      .Toastify__toast {
        background-color: #0f172a !important; /* slate-900 */
        border: 1px solid #1e293b !important; /* slate-800 */
        border-radius: 12px !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        padding: 12px 16px !important;
        margin-bottom: 8px !important;
        pointer-events: auto !important;
      }

      .Toastify__toast-body {
        color: #f8fafc !important; /* slate-50 */
        font-size: 14px !important;
        font-weight: 500 !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
      }

      .Toastify__close-button {
        color: #64748b !important;
        opacity: 1 !important;
      }

      .Toastify__close-button:hover {
        color: #f8fafc !important;
      }

      /* Progress bar colors matching your brand */
      .Toastify__progress-bar--success {
        background: linear-gradient(to right, #10b981, #06b6d4) !important;
      }

      .Toastify__progress-bar--error {
        background: #ef4444 !important;
      }

      .Toastify__progress-bar--info {
        background: linear-gradient(to right, #06b6d4, #3b82f6) !important;
      }

      .Toastify__progress-bar--warning {
        background: #f59e0b !important;
      }

      /* Icon colors */
      .Toastify__toast--success .Toastify__toast-icon svg {
        fill: #10b981 !important;
      }

      .Toastify__toast--error .Toastify__toast-icon svg {
        fill: #ef4444 !important;
      }

      .Toastify__toast--info .Toastify__toast-icon svg {
        fill: #06b6d4 !important;
      }

      .Toastify__toast--warning .Toastify__toast-icon svg {
        fill: #f59e0b !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
